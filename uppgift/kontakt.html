    <div class="main-grid">

            <label>
                Name
                <input type="text" placeholder="Your name">
            </label>
            <label>
                Email
                <input type="email" placeholder="you@example.com">
            </label>
            <label>
                Message
                <textarea rows="5" placeholder="Tell me what you want to learn"></textarea>
            </label>
                <button class="btn" type="submit">Send Message</button>
        </form>
    </main>
