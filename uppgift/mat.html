<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DayZ Food UI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="status-panel">
    <h3>SURVIVAL</h3>

    <div class="stat">
      <span class="icon">🍔</span>
      <div class="info">
        <span>Food</span>
        <div class="bar">
          <div class="fill food"></div>
        </div>
      </div>
    </div>

    <div class="stat">
      <span class="icon">💧</span>
      <div class="info">
        <span>Water</span>
        <div class="bar">
          <div class="fill water"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="quick-buttons">
    <button class="btn food-btn">🍔</button>
    <button class="btn water-btn">💧</button>
  </div>

</body>
</html>
